<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة المعلومات للصيانة الكهربائية لقسم البرس</title>
  
  <!-- Bootstrap 5 RTL CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شريط العنوان الرئيسي -->
  <header class="app-header shadow-sm">
    <div class="container text-center py-3">
      <i class="bi bi-cpu-fill text-warning fs-1 mb-2 d-inline-block"></i>
      <h1 class="h3 fw-bold text-white mb-1">بوابة المعلومات للصيانة الكهربائية لقسم البرس</h1>
      <p class="text-light-50 small mb-0">نظام استدعاء وثائق الدعم الفني والأعطال السريع</p>
    </div>
  </header>

  <!-- مسار التنقل وزر الرجوع -->
  <main class="container my-4">
    <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0" id="breadcrumbsNav">
          <!-- يتم توليده بالـ JS -->
        </ol>
      </nav>
      <button id="backBtn" class="btn btn-outline-warning btn-sm px-3 d-none">
        <i class="bi bi-arrow-right-short fs-5 align-middle"></i> رجوع
      </button>
    </div>

    <!-- شبكة عرض البطاقات -->
    <section>
      <div class="row g-3" id="cardsContainer">
        <!-- تتغير المحتويات ديناميكياً بواسطة app.js -->
      </div>
    </section>
  </main>

  <!-- Custom JavaScript -->
  <script src="app.js"></script>
</body>
</html>
